id: cold_open
title: THE LONG TRADE
showOnce: true
bodyLines:
  - >-
    You are a trader. Not the kind who counts profit in days — the kind who counts it in generations.
  - >-
    Your ship runs near the speed of light, and at that speed time stops being fair. The universe outside ages faster than you do. How much faster, you will learn.
  - >-
    You buy in one century and sell in the next. In between, civilizations do their work: they rise, argue, build wonders, and forget you.
  - >-
    Another station is ahead. Cargo first. Then the stars.
