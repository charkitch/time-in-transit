id: cold_open
title: THE LONG TRADE
showOnce: true
bodyLines:
  - >-
    You are a trader. Not the kind who counts profit in days — the kind who counts it in generations.
  - >-
    Your ship runs at nine-tenths the speed of light, and the universe politely declines to allow more. From your deck, the decades outside pass as months.
  - >-
    You buy in one century and sell in the next. In between, civilizations do their work: they rise, argue, build wonders, and forget you.
  - >-
    The station ahead is home — for the last time it will ever be exactly that. Cargo first. Then the stars.
